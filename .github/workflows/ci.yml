name: Integracion Continua

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: Compilar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar con Maven
        run: mvn clean compile

  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas unitarias
        run: mvn test

  integration-tests:
    name: Pruebas de integracion
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas de integracion
        run: mvn verify

  acceptance-tests:
    name: Pruebas de aceptacion
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas de aceptacion
        run: mvn test -Dtest=CalculadoraAcceptanceTest

  deploy-test:
    name: Deploy ambiente de prueba
    runs-on: ubuntu-latest
    needs: acceptance-tests

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generar artefacto
        run: mvn clean package

      - name: Crear ambiente de prueba
        run: mkdir -p deployment/staging

      - name: Desplegar artefacto en staging
        run: cp target/*.jar deployment/staging/

      - name: Verificar despliegue
        run: |
          echo "Verificando ambiente de prueba..."
          ls -la deployment/staging/
          test -n "$(find deployment/staging -name '*.jar' -print -quit)"
          echo "Despliegue en ambiente de prueba exitoso"